spring:
  application:
    name: auth-api
  datasource:
    # Host-run dev hits the compose Postgres published on localhost. Inside the
    # app container, compose overrides SPRING_DATASOURCE_URL to postgres:5432.
    url: jdbc:postgresql://localhost:5432/ntccpay
    username: ntccpay
    # Development only; real credentials come from the environment / secrets
    # (compose injects SPRING_DATASOURCE_PASSWORD; k8s uses secretKeyRef).
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never create or alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  kafka:
    # Host/dev default; compose overrides via SPRING_KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # at-least-once: acks=all + retries; consumers deduplicate via event id
      acks: all
      enable-idempotence: true
      retries: 10

server:
  port: 8080

ntccpay:
  rules:
    supported-currencies: [USD, EUR, GBP]
    per-transaction-limit: 50000
    blocked-cards: [4000000000000002]
    blocked-bins: [400100]
  security:
    # Development only. Real merchant keys come from the environment / secrets manager.
    api-keys:
      acme-corp: change-me-acme-key
  outbox:
    topic: auths.v1
    relay-enabled: true
    relay-poll-millis: 1000
    relay-batch-size: 50
    relay-send-timeout-millis: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
