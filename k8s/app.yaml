apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: ntccpay
  labels:
    app: auth-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          # Replace with your published image (e.g. from bootBuildImage / CI registry push)
          image: ghcr.io/ntccpay/auth-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Spring relaxed binding: these env vars override application.yml
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.ntccpay.svc.cluster.local:5432/ntccpay
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: ntccpay
  labels:
    app: auth-api
spec:
  selector:
    app: auth-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
